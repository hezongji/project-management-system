# =========================================================================
# docker-compose.prod.yml — 项目管理系统生产编排（精简可用版）
#
# 服务拓扑：
#   postgres  PostgreSQL 16（数据卷 pgdata，健康检查）
#   app       Next.js 主服务（standalone 产物，deploy/Dockerfile.app）
#   im        Socket.IO 即时通讯（独立进程 :3002，deploy/Dockerfile.im）
#   nginx     HTTP 反向代理（profile: http，80 端口）
#   caddy     HTTPS 自动证书反代（profile: https，80/443，Let's Encrypt）
#
# 推荐入口：./deploy/install.sh（自动生成 .env、检测依赖、启动、迁移）
#   手动 HTTP  ： docker compose --profile http up -d --build
#   手动 HTTPS ： docker compose --profile https up -d --build
#
# 环境变量来源：项目根目录 .env（见 .env.example 注释）
# =========================================================================

services:
  # ---------- PostgreSQL 16 ----------
  postgres:
    image: postgres:16-alpine
    container_name: pm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-pm}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
      POSTGRES_DB: ${DB_NAME:-pm}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${PG_EXPOSE_PORT:-127.0.0.1:5432:5432}"   # 默认仅本机回环可访问；内网需暴露请改 .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pm} -d ${DB_NAME:-pm}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - pm-net

  # ---------- 主服务（Next.js App Router :3000） ----------
  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile.app
      args:
        # NEXT_PUBLIC_* 为构建期内联：这里把站点 origin 根注入构建，避免客户端回退 localhost
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-${APP_URL:-http://localhost}}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-${APP_URL:-http://localhost}}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-${APP_URL:-http://localhost}}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-项目管理系统}
    container_name: pm-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # 优先用外部 DATABASE_URL，否则用 DB_* 拼内置 postgres
      DATABASE_URL: ${DATABASE_URL:-postgresql://${DB_USER:-pm}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-pm}?schema=public}
      JWT_SECRET: ${JWT_SECRET:?}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-${APP_URL:-http://localhost}}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-${APP_URL:-http://localhost}}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-${APP_URL:-http://localhost}}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-项目管理系统}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-${APP_URL:-http://localhost}}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-}
      FILE_ROOT: /data/pm-files
      FILE_MAX_SIZE: ${FILE_MAX_SIZE:-104857600}
      FILE_QUOTA_PER_PROJECT: ${FILE_QUOTA_PER_PROJECT:-10737418240}
      ALLOWED_FILE_TYPES: ${ALLOWED_FILE_TYPES:-}
      DRIVE_RECYCLE_RETAIN_DAYS: ${DRIVE_RECYCLE_RETAIN_DAYS:-30}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      MIMO_API_KEY: ${MIMO_API_KEY:-}
      MIMO_BASE_URL: ${MIMO_BASE_URL:-}
      MIMO_MODEL: ${MIMO_MODEL:-}
    volumes:
      - files:/data/pm-files
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - pm-net

  # ---------- IM 服务（Socket.IO :3002） ----------
  im:
    build:
      context: .
      dockerfile: deploy/Dockerfile.im
    container_name: pm-im
    restart: unless-stopped
    environment:
      NODE_ENV: production
      IM_PORT: 3002
      DATABASE_URL: ${DATABASE_URL:-postgresql://${DB_USER:-pm}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-pm}?schema=public}
      IM_DATABASE_URL: ${IM_DATABASE_URL:-}
      JWT_SECRET: ${JWT_SECRET:?}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      IM_STORE: ${IM_STORE:-auto}
      IM_SEED_DEMO: ${IM_SEED_DEMO:-true}
      IM_HEARTBEAT_MS: ${IM_HEARTBEAT_MS:-30000}
      IM_HEARTBEAT_TIMEOUT_MS: ${IM_HEARTBEAT_TIMEOUT_MS:-10000}
      IM_NOTIFY_CHANNEL: ${IM_NOTIFY_CHANNEL:-im_events}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3002"
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://localhost:3002/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - pm-net

  # ---------- Nginx HTTP 反代（HTTP 模式，profile: http） ----------
  nginx:
    image: nginx:1.25-alpine
    container_name: pm-nginx
    restart: unless-stopped
    profiles: ["http"]
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro          # 手动 HTTPS 证书目录（可选）
      - files:/data/pm-files:ro                      # 可选：文件卷直供（如需静态下载）
      - downloads:/data/downloads                    # APK 分发直出（build-apk.sh 产出）
    depends_on:
      - app
      - im
    networks:
      - pm-net

  # ---------- Caddy 自动 HTTPS（HTTPS 模式，profile: https） ----------
  caddy:
    image: caddy:2-alpine
    container_name: pm-caddy
    restart: unless-stopped
    profiles: ["https"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - downloads:/srv/downloads                    # APK 分发直出（可选）
    depends_on:
      - app
      - im
    networks:
      - pm-net

volumes:
  pgdata:
  files:
  downloads:
  caddy_data:
  caddy_config:

networks:
  pm-net:
    driver: bridge
