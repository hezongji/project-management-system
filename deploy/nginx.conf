# =========================================================================
# nginx.conf — 项目管理系统反向代理
# 路由：
#   /           → app:3000   (页面 + REST API)
#   /api        → app:3000   (Next.js Route Handlers)
#   /socket.io  → im:3002    (Socket.IO WebSocket, 带 Upgrade 头)
# 特性：gzip 压缩、安全响应头基线
# 挂载到 /etc/nginx/conf.d/default.conf
# =========================================================================

# 基于 HTTP/1.1 代理（WebSocket 需要）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 前端需要 gzip 的资源类型
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 6;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml
    application/font-woff2;

# 上游服务
upstream app_backend {
    server app:3000;
}

upstream im_backend {
    server im:3002;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # 默认入口（HTTP 可重定向到 HTTPS，若已配置证书）
    # return 301 https://$host$request_uri;   # 生产启用 HTTPS 时取消注释并删掉下段

    client_max_body_size 100m;

    # ---------- 安全头基线 ----------
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ---------- 页面 + REST API → app:3000 ----------
    location / {
        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ---------- REST API → app:3000 ----------
    location /api/ {
        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ---------- Socket.IO WebSocket → im:3002 ----------
    location /socket.io/ {
        proxy_pass http://im_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket 长连接
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # 兼容别名：/api/im-socket → im:3002（保留旧路径）
    location /api/im-socket/ {
        proxy_pass http://im_backend/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # 静态资源直接返回 404（由 Next.js 处理）
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff2?|svg)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri @fallback;
    }

    location @fallback {
        proxy_pass http://app_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
