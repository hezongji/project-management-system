# =========================================================================
# docker-compose.yml — 项目管理系统全栈编排（app + im + postgres + nginx）
# 使用方法：cp deploy/.env.example .env  →  修改变量  →  docker compose up -d
# 文档：deploy/README.md
# =========================================================================

services:
  # ---------- PostgreSQL 16 ----------
  postgres:
    image: postgres:16-alpine
    container_name: pm-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-pm}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-pm}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${PG_EXPOSE_PORT:-5432}:5432"   # 外部可访问；内网部署可注释掉
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pm} -d ${DB_NAME:-pm}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - pm-net

  # ---------- 主服务（Next.js App Router :3000） ----------
  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile.app
    container_name: pm-app
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER:-pm}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-pm}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      NEXT_PUBLIC_APP_URL: ${APP_URL}
      NEXT_PUBLIC_API_URL: ${APP_URL}
      NEXT_PUBLIC_WS_URL: ${APP_URL}/api/im-socket
      NEXT_PUBLIC_APP_NAME: ${APP_NAME:-项目管理系统}
      FILE_ROOT: /data/pm-files
      NEXTAUTH_URL: ${APP_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
    volumes:
      - files:/data/pm-files
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - pm-net

  # ---------- IM 服务（Socket.IO 独立进程 :3002） ----------
  im:
    build:
      context: .
      dockerfile: deploy/Dockerfile.im
    container_name: pm-im
    restart: always
    environment:
      NODE_ENV: production
      IM_PORT: 3002
      DATABASE_URL: postgresql://${DB_USER:-pm}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-pm}?schema=public
      IM_DATABASE_URL: postgresql://${DB_USER:-pm}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-pm}?schema=public
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3002"
    networks:
      - pm-net

  # ---------- Nginx 反向代理（80/443） ----------
  nginx:
    image: nginx:1.25-alpine
    container_name: pm-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro     # 证书目录（.env.example 有说明）
      - files:/data/pm-files:ro                # 可选：静态文件直供
    depends_on:
      - app
      - im
    networks:
      - pm-net

volumes:
  pgdata:
  files:

networks:
  pm-net:
    driver: bridge
