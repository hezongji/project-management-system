# Fluentd配置文件
<source>
  @type tail
  path /var/log/containers/*project-management*.log
  pos_file /var/log/fluentd-containers.log.pos
  tag kubernetes.*
  format json
  time_format %Y-%m-%dT%H:%M:%S.%NZ
</source>

<source>
  @type tail
  path /app/logs/*.log
  pos_file /var/log/fluentd-app.log.pos
  tag application.*
  format json
  time_format %Y-%m-%dT%H:%M:%S.%NZ
</source>

<source>
  @type tail
  path /var/log/nginx/access.log
  pos_file /var/log/fluentd-nginx-access.log.pos
  tag nginx.access
  format json
  time_format %Y-%m-%dT%H:%M:%S.%NZ
</source>

<source>
  @type tail
  path /var/log/nginx/error.log
  pos_file /var/log/fluentd-nginx-error.log.pos
  tag nginx.error
  format json
  time_format %Y-%m-%dT%H:%M:%S.%NZ
</source>

# 解析Kubernetes日志
<filter kubernetes.**>
  @type kubernetes_metadata
  merge_json_log true
  preserve_json_log true
</filter>

# 解析应用日志
<filter application.**>
  @type parser
  format json
  key_name message
  reserve_data true
</filter>

# 解析Nginx访问日志
<filter nginx.access>
  @type parser
  format combined
  key_name message
  reserve_data true
</filter>

# 解析Nginx错误日志
<filter nginx.error>
  @type parser
  format /^(?<time>\d{4}/\d{2}/\d{2} \d{2}:\d{2}:\d{2}) \[(?<level>\w+)\] (?<pid>\d+)#(?<tid>\d+): (?<message>.*)$/
  reserve_data true
</filter>

# 添加通用字段
<filter **>
  @type record_transformer
  <record>
    environment production
    application project-management
    cluster production-cluster
    hostname #{Socket.gethostname}
  </record>
</filter>

# 处理敏感信息
<filter **>
  @type record_transformer
  <record>
    message ${record["message"].gsub(/password=[^&]*/, "password=***")}
    message ${record["message"].gsub(/token=[^&]*/, "token=***")}
    message ${record["message"].gsub(/key=[^&]*/, "key=***")}
    message ${record["message"].gsub(/secret=[^&]*/, "secret=***")}
  </record>
</filter>

# 输出到Elasticsearch
<match **>
  @type elasticsearch
  host elasticsearch
  port 9200
  index_name project-management-${Time.strftime('%Y.%m.%d')}
  type_name _doc
  include_tag_key true
  tag_key @log_name
  flush_interval 5s
  reload_connections false
  reconnect_on_error true
  reload_on_failure true
  <buffer>
    @type file
    path /var/log/fluentd/buffer
    flush_mode interval
    retry_type exponential_backoff
    flush_thread_count 2
    flush_interval 5s
    retry_forever true
    retry_max_interval 30
    chunk_limit_size 2M
    total_limit_size 1G
    overflow_action block
  </buffer>
</match>

# 输出到标准输出（调试用）
<match **>
  @type stdout
</match>