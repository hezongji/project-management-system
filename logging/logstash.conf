# Logstash配置文件
input {
  # 从文件读取日志
  file {
    path => "/app/logs/*.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => "json"
    tags => ["application"]
  }
  
  # 从Kubernetes Pods读取日志
  file {
    path => "/var/log/containers/*project-management*.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => "json"
    tags => ["kubernetes"]
  }
  
  # 从Nginx访问日志读取
  file {
    path => "/var/log/nginx/access.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => "json"
    tags => ["nginx", "access"]
  }
  
  # 从Nginx错误日志读取
  file {
    path => "/var/log/nginx/error.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    tags => ["nginx", "error"]
  }
  
  # 从系统日志读取
  syslog {
    port => 5514
    tags => ["syslog"]
  }
  
  # 从应用服务读取日志
  tcp {
    port => 5000
    codec => "json"
    tags => ["application", "tcp"]
  }
  
  udp {
    port => 5001
    codec => "json"
    tags => ["application", "udp"]
  }
}

filter {
  # 处理应用日志
  if "application" in [tags] {
    # 解析时间戳
    date {
      match => [ "timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss", "yyyy-MM-dd'T'HH:mm:ss.SSSZ" ]
      target => "@timestamp"
    }
    
    # 解析日志级别
    if [level] {
      mutate {
        add_field => { "log_level" => "%{level}" }
      }
    }
    
    # 解析用户ID
    if [userId] {
      mutate {
        add_field => { "user_id" => "%{userId}" }
      }
    }
    
    # 解析请求ID
    if [requestId] {
      mutate {
        add_field => { "request_id" => "%{requestId}" }
      }
    }
    
    # 解析IP地址
    if [clientIp] {
      mutate {
        add_field => { "client_ip" => "%{clientIp}" }
      }
      
      # 获取地理位置信息
      geoip {
        source => "client_ip"
        target => "geoip"
      }
    }
    
    # 解析用户代理
    if [userAgent] {
      useragent {
        source => "userAgent"
        target => "user_agent"
      }
    }
    
    # 解析错误堆栈
    if [stack] {
      grok {
        match => { "stack" => "(?<error_type>%{WORD}: %{GREEDYDATA})" }
      }
    }
  }
  
  # 处理Nginx访问日志
  if "nginx" in [tags] and "access" in [tags] {
    grok {
      match => { "message" => "%{COMBINEDAPACHELOG}" }
    }
    
    date {
      match => [ "timestamp", "dd/MMM/yyyy:HH:mm:ss Z" ]
      target => "@timestamp"
    }
    
    # 解析用户代理
    useragent {
      source => "agent"
      target => "user_agent"
    }
    
    # 解析IP地址
    geoip {
      source => "clientip"
      target => "geoip"
    }
    
    # 计算响应时间
    if [request] and [upstream_time] {
      ruby {
        code => "event.set('response_time', event.get('upstream_time').to_f)"
      }
    }
  }
  
  # 处理Nginx错误日志
  if "nginx" in [tags] and "error" in [tags] {
    grok {
      match => { "message" => "%{NGINXERRORLOG}" }
    }
    
    date {
      match => [ "timestamp", "yyyy/MM/dd HH:mm:ss" ]
      target => "@timestamp"
    }
  }
  
  # 处理Kubernetes日志
  if "kubernetes" in [tags] {
    # 解析Kubernetes元数据
    json {
      source => "kubernetes"
      target => "kubernetes"
    }
    
    # 解析容器元数据
    json {
      source => "stream"
      target => "stream"
    }
    
    # 解析时间戳
    date {
      match => [ "time", "ISO8601" ]
      target => "@timestamp"
    }
    
    # 添加Kubernetes标签
    if [kubernetes] {
      mutate {
        add_field => {
          "kubernetes_pod" => "%{[kubernetes][pod_name]}"
          "kubernetes_namespace" => "%{[kubernetes][namespace_name]}"
          "kubernetes_container" => "%{[kubernetes][container_name]}"
        }
      }
    }
  }
  
  # 处理系统日志
  if "syslog" in [tags] {
    grok {
      match => { "message" => "%{SYSLOGBASE}" }
    }
    
    date {
      match => [ "timestamp", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss" ]
      target => "@timestamp"
    }
    
    # 解析进程信息
    if [program] {
      grok {
        match => { "program" => "%{WORD:process_name}[%{NUMBER:process_id}]" }
      }
    }
  }
  
  # 添加通用字段
  mutate {
    add_field => {
      "environment" => "production"
      "application" => "project-management"
      "cluster" => "production-cluster"
    }
  }
  
  # 移除不需要的字段
  mutate {
    remove_field => [
      "message",
      "@version",
      "host",
      "path",
      "tags"
    ]
  }
  
  # 处理敏感信息
  if [message] {
    mutate {
      gsub => [
        "message", "password=[^&]*", "password=***",
        "message", "token=[^&]*", "token=***",
        "message", "key=[^&]*", "key=***",
        "message", "secret=[^&]*", "secret=***"
      ]
    }
  }
}

output {
  # 输出到Elasticsearch
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "project-management-%{+YYYY.MM.dd}"
    template_name => "project-management"
    template => "/usr/share/logstash/templates/project-management-template.json"
    template_overwrite => true
    document_id => "%{request_id}"
  }
  
  # 输出到标准输出（调试用）
  stdout {
    codec => rubydebug
  }
  
  # 输出到文件（备份用）
  file {
    path => "/var/log/logstash/processed-logs.log"
    codec => line { format => "%{timestamp} %{level} %{message}" }
  }
}