# 应用服务密钥【模板】
# ⚠️ 所有值均为占位符，部署前必须替换：
#    1. 用强随机值生成密钥，例如：openssl rand -hex 32
#    2. echo -n "你的真实值" | base64 后填入下方 data 字段
#    3. 严禁把生成后的真实 secrets.yaml 提交进仓库
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: project-management
type: Opaque
data:
  # 使用 base64 编码的密钥 (echo -n "your-secret" | base64)
  DATABASE_PASSWORD: UExBQ0VIT0xERVI=      # <替换：数据库强密码>
  REDIS_PASSWORD: UExBQ0VIT0xERVI=        # <替换：Redis 强密码>
  JWT_SECRET: UExBQ0VIT0xERVI=            # <替换：openssl rand -hex 32>
  JWT_REFRESH_SECRET: UExBQ0VIT0xERVI=    # <替换：openssl rand -hex 32>
  NEXTAUTH_SECRET: UExBQ0VIT0xERVI=       # <替换：openssl rand -base64 32>
  EMAIL_USER: UExBQ0VIT0xERVI=            # <替换：发件邮箱>
  EMAIL_PASS: UExBQ0VIT0xERVI=            # <替换：邮箱授权码，勿用登录密码>
  AWS_ACCESS_KEY_ID: UExBQ0VIT0xERVI=     # <替换：最小权限的 IAM Key>
  AWS_SECRET_ACCESS_KEY: UExBQ0VIT0xERVI= # <替换：同上>
  AWS_S3_BUCKET: UExBQ0VIT0xERVI=         # <替换：真实 bucket 名>
  GRAFANA_PASSWORD: UExBQ0VIT0xERVI=      # <替换：Grafana 强密码>
---
# SSL证书密钥【模板】
# 部署时替换为真实证书：kubectl create secret tls ssl-certificate --cert=tls.crt --key=tls.key
apiVersion: v1
kind: Secret
metadata:
  name: ssl-certificate
  namespace: project-management
type: kubernetes.io/tls
data:
  tls.crt: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0t...
  tls.key: LS0tLS1CRUdJTiBQUklWQVRFIEtFWS0tLS0t...
---
# Docker镜像拉取密钥【模板】
# 部署时替换：kubectl create secret docker-registry registry-credentials \
#   --docker-server=https://index.docker.io/v1/ --docker-username=<> --docker-password=<>
apiVersion: v1
kind: Secret
metadata:
  name: registry-credentials
  namespace: project-management
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: UExBQ0VIT0xERVI=
