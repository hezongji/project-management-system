# Redis集群配置
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: project-management
spec:
  serviceName: redis-service
  replicas: 3
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        command:
        - redis-server
        - /etc/redis/redis.conf
        ports:
        - containerPort: 6379
          name: redis
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: REDIS_PASSWORD
        volumeMounts:
        - name: redis-data
          mountPath: /data
        - name: redis-config
          mountPath: /etc/redis/redis.conf
          subPath: redis.conf
        resources:
          requests:
            memory: "256Mi"
            cpu: "0.25"
          limits:
            memory: "512Mi"
            cpu: "0.5"
        livenessProbe:
          exec:
            command:
            - redis-cli
            - -a
            - $(REDIS_PASSWORD)
            - ping
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - redis-cli
            - -a
            - $(REDIS_PASSWORD)
            - ping
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: redis-config
        configMap:
          name: redis-config
  volumeClaimTemplates:
  - metadata:
      name: redis-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 5Gi
---
# Redis服务
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: project-management
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
  clusterIP: None
---
# Redis哨兵配置
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-sentinel
  namespace: project-management
spec:
  replicas: 3
  selector:
    matchLabels:
      app: redis-sentinel
  template:
    metadata:
      labels:
        app: redis-sentinel
    spec:
      containers:
      - name: redis-sentinel
        image: redis:7-alpine
        command:
        - redis-sentinel
        - /etc/redis/sentinel.conf
        ports:
        - containerPort: 26379
          name: sentinel
        volumeMounts:
        - name: sentinel-config
          mountPath: /etc/redis/sentinel.conf
          subPath: sentinel.conf
        resources:
          requests:
            memory: "128Mi"
            cpu: "0.1"
          limits:
            memory: "256Mi"
            cpu: "0.25"
      volumes:
      - name: sentinel-config
        configMap:
          name: redis-sentinel-config
---
# Redis哨兵服务
apiVersion: v1
kind: Service
metadata:
  name: redis-sentinel-service
  namespace: project-management
spec:
  selector:
    app: redis-sentinel
  ports:
  - port: 26379
    targetPort: 26379
  clusterIP: None
---
# Redis哨兵配置ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-sentinel-config
  namespace: project-management
data:
  sentinel.conf: |
    # Redis哨兵配置
    bind 0.0.0.0
    port 26379
    daemonize no
    pidfile /var/run/redis/redis-sentinel.pid
    logfile ""
    dir /tmp
    
    # 监控主节点
    sentinel monitor mymaster redis-service-0.redis-service.project-management.svc.cluster.local 6379 2
    sentinel auth-pass mymaster $(REDIS_PASSWORD)
    sentinel down-after-milliseconds mymaster 30000
    sentinel parallel-syncs mymaster 1
    sentinel failover-timeout mymaster 180000
    
    # 配置
    sentinel announce-ip ""
    sentinel announce-port 26379
    sentinel announce-sentinel-ip ""
    sentinel announce-sentinel-port 26379