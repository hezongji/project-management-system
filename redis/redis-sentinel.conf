# Redis哨兵配置文件
# 基础配置
bind 0.0.0.0
port 26379
daemonize no
pidfile /var/run/redis/redis-sentinel.pid
logfile ""
dir /tmp

# 哨兵配置
sentinel monitor mymaster redis-master 6379 2
sentinel auth-pass mymaster ${REDIS_PASSWORD}
sentinel down-after-milliseconds mymaster 30000
sentinel parallel-syncs mymaster 1
sentinel failover-timeout mymaster 180000

# 配置发现
sentinel announce-ip ${SENTINEL_ANNOUNCE_IP}
sentinel announce-port ${SENTINEL_ANNOUNCE_PORT}
sentinel announce-sentinel-ip ${SENTINEL_ANNOUNCE_IP}
sentinel announce-sentinel-port ${SENTINEL_ANNOUNCE_PORT}

# 哨兵间通信
sentinel announce-hostnames no
sentinel resolve-hostnames no
sentinel announce-usernames no
sentinel resolve-usernames no

# 安全配置
requirepass ${REDIS_PASSWORD}
sentinel auth-pass mymaster ${REDIS_PASSWORD}

# 日志配置
loglevel notice
syslog-enabled no
syslog-ident redis-sentinel
syslog-facility local0

# 网络配置
tcp-keepalive 300
tcp-backlog 511
timeout 0

# 监控配置
latency-monitor-threshold 100

# 客户端配置
maxclients 10000

# TLS配置（如果需要）
# tls-port 0
# tls-cert-file /etc/ssl/redis.crt
# tls-key-file /etc/ssl/redis.key
# tls-ca-cert-file /etc/ssl/ca.crt
# tls-auth-clients no
# tls-replication yes
# tls-cluster yes